global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Services expose Micrometer metrics at /actuator/prometheus.
  # (Reachable when the services run via the compose "app" profile.)
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: world-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["world-service:8090"]
