server:
  port: ${AUTH_SERVICE_PORT:8080}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${MMO_DB_HOST:localhost}:${MMO_DB_PORT:5432}/${MMO_DB_NAME:mmorpg}
    username: ${MMO_DB_USER:mmo}
    password: ${MMO_DB_PASS:mmo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    create-schemas: true
    locations: classpath:db/migration

mmo:
  jwt:
    # Override in real environments. Must be >= 32 bytes for HS256.
    secret: ${MMO_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes!!}
    issuer: ${MMO_JWT_ISSUER:mmo-auth}
    access-ttl: ${MMO_JWT_ACCESS_TTL:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
