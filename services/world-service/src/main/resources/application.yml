server:
  port: ${WORLD_SERVICE_PORT:8090}

spring:
  application:
    name: world-service
  datasource:
    url: jdbc:postgresql://${MMO_DB_HOST:localhost}:${MMO_DB_PORT:5432}/${MMO_DB_NAME:mmorpg}
    username: ${MMO_DB_USER:mmo}
    password: ${MMO_DB_PASS:mmo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: game
  flyway:
    enabled: true
    schemas: game
    default-schema: game
    create-schemas: true
    locations: classpath:db/migration

mmo:
  jwt:
    # MUST match the auth-service signing config so tokens it issues verify here.
    secret: ${MMO_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes!!}
    issuer: ${MMO_JWT_ISSUER:mmo-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
